[pytest]
# `-m "not scale and not evals"` keeps two opt-in suites out of the default run: the scale
# harness (host/tests/test_scale.py) generates tens of thousands of runs and benches them, and
# the self-growth regression suite (host/tests/test_evals.py) replays evals/cases -- and in live
# mode calls a real model. Run them with `pytest -m scale` / `pytest -m evals` (the command-line
# -m overrides this one). NOTE: this repo's pytest config lives here, not in a pyproject.toml.
addopts = -p asyncio --import-mode=importlib -m "not scale and not evals"
asyncio_mode = auto
testpaths = atworks-agent/core/tests atworks-agent/runtime/tests host/tests
markers =
    scale: opt-in scale harness (synthetic dataset generation + SLO bench); excluded by default
    evals: opt-in self-growth regression suite (evals/cases replay; live mode needs a real model); excluded by default
