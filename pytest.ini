[pytest]
# `-m "not scale"` keeps the opt-in scale harness (host/tests/test_scale.py) out of the default
# suite -- it generates tens of thousands of runs and benches them. Run it with `pytest -m scale`
# (the command-line -m overrides this one). NOTE: this repo's pytest config lives here, not in a
# pyproject.toml.
addopts = -p asyncio --import-mode=importlib -m "not scale"
asyncio_mode = auto
testpaths = atworks-agent/core/tests atworks-agent/runtime/tests host/tests
markers =
    scale: opt-in scale harness (synthetic dataset generation + SLO bench); excluded by default
