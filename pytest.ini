[pytest]
addopts = -p asyncio --import-mode=importlib
asyncio_mode = auto
testpaths = atworks-agent/core/tests atworks-agent/runtime/tests host/tests
# TestDataSet is a domain type (atworks_agent.types.TestDataSet), not a test class; the suite
# is entirely function-based, so nothing else matches pytest's default "Test*" collection.
filterwarnings =
    ignore:cannot collect test class 'TestDataSet' because it has a __init__ constructor:pytest.PytestCollectionWarning
